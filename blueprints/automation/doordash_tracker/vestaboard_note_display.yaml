blueprint:
  name: DoorDash Tracker → Vestaboard Note (temporary takeover)
  description: >-
    On each DoorDash status, label or ETA change, shows the update on a Vestaboard Note
    (15×3) for a few minutes, then hands the board back to your regular
    automations. Skipped while any exclusion helper is on.

    Row 1: ETA (or DOORDASH) · Row 2: status · Row 3: 4-step progress bar
    (green = done, yellow = current, white = pending).
  domain: automation
  source_url: https://github.com/thrivestorm2/ha-doordash-tracker/blob/main/blueprints/automation/doordash_tracker/vestaboard_note_display.yaml
  input:
    status_sensor:
      name: DoorDash status sensor
      default: sensor.doordash_tracker_status
      selector:
        entity:
          filter:
            - integration: doordash_tracker
              domain: sensor
    vestaboard_device:
      name: Vestaboard Note
      selector:
        device:
          filter:
            - integration: vestaboard
    exclusions:
      name: Exclusions
      description: If any of these are on, the board is left alone.
      default:
        - input_boolean.ninja_mode
        - input_boolean.vestaboard_alert_active
        - input_boolean.vestaboard_baseball_active
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_boolean
    hold_minutes:
      name: Display time (minutes)
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
    min_eta_interval:
      name: Minimum time between ETA-only updates (seconds)
      description: >-
        An ETA change that arrives sooner than this after the last board write
        is ignored, so a flapping ETA can't rewrite the board every minute.
        Status and label changes always update the board.
      default: 120
      selector:
        number:
          min: 0
          max: 900
          step: 30
          unit_of_measurement: s
    night_start:
      name: Night starts
      default: "22:00:00"
      selector:
        time: {}
    night_end:
      name: Night ends
      default: "06:00:00"
      selector:
        time: {}
    night_automation:
      name: Restore at night
      description: Automation to re-run after the takeover during night hours.
      default: []
      selector:
        entity:
          filter:
            - domain: automation
    day_automation:
      name: Restore during the day
      description: Automation to re-run after the takeover outside night hours.
      default: []
      selector:
        entity:
          filter:
            - domain: automation

mode: restart

variables:
  status_entity: !input status_sensor
  exclusions: !input exclusions
  night_automation: !input night_automation
  day_automation: !input day_automation
  min_eta_interval: !input min_eta_interval
  # An unset entity input stays as its default [], a chosen one is a string.
  has_night_automation: "{{ night_automation is string and night_automation != '' }}"
  has_day_automation: "{{ day_automation is string and day_automation != '' }}"

# One trigger per sensor update, so a step and label change arriving together
# writes the board once. The conditions decide whether the update matters.
trigger:
  - platform: state
    entity_id: !input status_sensor

condition:
  - condition: template
    value_template: "{{ states(status_entity) in ['1', '2', '3', '4'] }}"
  - condition: template
    value_template: "{{ exclusions | select('is_state', 'on') | list | length == 0 }}"
  # Write only when a field the board shows has changed: always for the step
  # or label, and for an ETA-only change once min_eta_interval has passed since
  # the last write. The detail and tracking attributes are ignored. Conditions
  # run before mode: restart cancels the current run, so a skipped update
  # leaves the board and the pending restore alone.
  - condition: template
    value_template: >-
      {%- set old = trigger.from_state -%}
      {%- set new = trigger.to_state -%}
      {%- if old is none or old.state != new.state
            or old.attributes.get('label') != new.attributes.get('label') -%}
        true
      {%- elif old.attributes.get('eta') != new.attributes.get('eta') -%}
        {%- set last = this.attributes.get('last_triggered') -%}
        {{- last is none
            or (now() - as_datetime(last | string)).total_seconds()
               >= min_eta_interval | float(0) -}}
      {%- else -%}
        false
      {%- endif -%}

action:
  - action: vestaboard.message
    data:
      device_id:
        - !input vestaboard_device
      message: >-
        {%- set R = '{63}' -%}
        {%- set G = '{66}' -%}
        {%- set Y = '{65}' -%}
        {%- set W = '{69}' -%}
        {%- set step = states(status_entity) | int(0) -%}
        {%- set label = (state_attr(status_entity, 'label') or 'DOORDASH') | upper -%}
        {%- set eta = (state_attr(status_entity, 'eta') or '') | upper -%}
        {%- set top = ('ETA ' ~ eta) if (eta and step < 4) else 'DOORDASH' -%}
        {%- set row1 = R ~ (top[:13] | center(13)) ~ R -%}
        {%- set row2 = R ~ (label[:13] | center(13)) ~ R -%}
        {%- set ns = namespace(bar='') -%}
        {%- for i in range(1, 5) -%}
          {%- set c = G if (i < step or step == 4) else (Y if i == step else W) -%}
          {%- set ns.bar = ns.bar ~ c ~ c ~ c ~ (' ' if i < 4 else '') -%}
        {%- endfor -%}
        {{- row1 ~ ' ' ~ row2 ~ ' ' ~ ns.bar -}}
  - delay:
      minutes: !input hold_minutes
  # automation.trigger keeps each automation's own conditions (exclusions,
  # ownership helpers) in force.
  - if:
      - condition: time
        after: !input night_start
        before: !input night_end
    then:
      - if:
          - condition: template
            value_template: "{{ has_night_automation }}"
        then:
          - action: automation.trigger
            target:
              entity_id: !input night_automation
            data:
              skip_condition: false
    else:
      - if:
          - condition: template
            value_template: "{{ has_day_automation }}"
        then:
          - action: automation.trigger
            target:
              entity_id: !input day_automation
            data:
              skip_condition: false
